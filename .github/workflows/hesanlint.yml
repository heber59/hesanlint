name: CI & Auto Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD — runs on PR and push to main
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=bin/hesanlint.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesanlint-build
          path: |
            bin/hesanlint.js
            node_modules

  # ─────────────────────────────────────────────
  # 2. LINT — only on push to main
  # ─────────────────────────────────────────────
  lint:
    name: Performance Lint
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hesanlint-build

      - name: Run hesanlint
        run: node bin/hesanlint.js ./src --ci --score

  # ─────────────────────────────────────────────
  # 3. TEST — only on push to main
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─────────────────────────────────────────────
  # 4. AUTO RELEASE — only on push to main
  # ─────────────────────────────────────────────
  autorelease:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Configure Git
        run: |
          git config --global user.email hesan0308@gmail.com
          git config --global user.name hesan0308

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        # Only install production deps — do NOT install auto plugins
        # here as --save-dev modifies package.json which dirties the tree.
        run: npm install

      - name: Untrack build artifact from git
        # bin/hesanlint.js is generated — it should never have been
        # committed. Remove it from git index so auto doesn't see it
        # as a dirty tracked file. The file stays on disk.
        run: |
          git rm --cached bin/hesanlint.js 2>/dev/null || true
          git rm --cached package-lock.json 2>/dev/null || true
          echo "bin/hesanlint.js" >> .gitignore
          echo "package-lock.json" >> .gitignore
          git add .gitignore
          git diff --staged --quiet || git commit -m "chore: untrack build artifacts [skip ci]"

      - name: Bundle with esbuild
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=bin/hesanlint.js

      - name: Verify clean working directory
        run: git status && git diff --stat

      - name: Release
        run: npx auto shipit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
