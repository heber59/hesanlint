name: CI & Auto Release

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Create dist directory
        run: mkdir -p dist

      - name: Bundle CLI
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=dist/cli.js

      - name: Verify launcher
        run: |
          head -1 bin/hesanlint.js
          test "$(head -1 bin/hesanlint.js)" = "#!/usr/bin/env node"

  lint:
    name: Performance Lint
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Create dist directory
        run: mkdir -p dist

      - name: Bundle CLI
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=dist/cli.js

      - name: Run hesanlint
        run: node bin/hesanlint.js ./src --ci --score

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests

  autorelease:
    name: Auto Release
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Configure Git
        run: |
          git config --global user.email "hesan0308@gmail.com"
          git config --global user.name "hesan0308"

      - name: Install dependencies
        run: npm install

      - name: Create dist directory
        run: mkdir -p dist

      - name: Bundle CLI
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=dist/cli.js
      - name: Verify npm package access
        run: |
          npm whoami
          npm view hesanlint version
      - name: Verify launcher
        run: |
          echo "Launcher:"
          head -3 bin/hesanlint.js

          FIRST_LINE="$(head -1 bin/hesanlint.js)"

          if [ "$FIRST_LINE" != "#!/usr/bin/env node" ]; then
            echo "bin/hesanlint.js was overwritten"
            exit 1
          fi

      - name: Verify bundle exists
        run: |
          test -f dist/cli.js
      - name: Configure npm
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release
        run: npx auto shipit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
