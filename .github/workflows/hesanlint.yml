name: CI & Auto Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=bin/hesanlint.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesanlint-build
          path: |
            bin/hesanlint.js
            node_modules

  lint:
    name: Performance Lint
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hesanlint-build

      - name: Run hesanlint
        run: node bin/hesanlint.js ./src --ci --score

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests

  autorelease:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Configure Git
        run: |
          git config --global user.email hesan0308@gmail.com
          git config --global user.name hesan0308

      - name: Install dependencies
        run: npm install

      - name: Bundle with esbuild
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=bin/hesanlint.js

      - name: Release
        run: npx auto shipit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
