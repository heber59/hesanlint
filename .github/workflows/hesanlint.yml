name: CI & Auto Release

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: mkdir -p dist

      - name: Bundle
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=dist/cli.js

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            package.json
            bin

  lint:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node bin/hesanlint.js ./src --ci --score

  test:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test -- --passWithNoTests

  autorelease:
    needs: [lint, test]
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.head_commit.message, 'skip ci')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - run: mkdir -p dist

      - name: Bundle
        run: |
          npx esbuild src/cli.js \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=esm \
            --packages=external \
            --outfile=dist/cli.js

      - name: Verify executable
        run: |
          head -1 bin/hesanlint.js
          test "$(head -1 bin/hesanlint.js)" = "#!/usr/bin/env node"

      - run: npx auto shipit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
